name: Publish React Native SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install --global 'npm@^11.5.1'
      - name: Validate the release tag and source
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(sed -n "s/^export const landerSdkVersion = '\(.*\)'$/\1/p" src/version.ts)" = "$version"
          grep -qxF "## $version" CHANGELOG.md
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - name: Publish with trusted publishing and provenance
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "react-native-lander@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::react-native-lander@$VERSION is already published."
            exit 0
          fi
          npm publish --provenance --access public

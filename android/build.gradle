buildscript {
  ext.getExtOrDefault = { name, fallback ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

// Runs codegen for src/native/NativeRNLander.ts (NativeRNLanderSpec).
apply plugin: "com.facebook.react"

android {
  namespace "link.lander.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Play Install Referrer: read once on first launch for deferred deep links.
  implementation "com.android.installreferrer:installreferrer:2.2"
}
